# Finanzas en tu PC, para uso real: base propia (separada de la de desarrollo), API, web y respaldos diarios.
# Solo escucha en 127.0.0.1:47830; Tailscale la publica con HTTPS para tus dispositivos.
# No se usa directo: lo levanta deploy/casa/iniciar.ps1 desde la copia en ..\finanzas-casa
name: finanzas-casa

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Sin "ports": la base solo es accesible dentro de Docker y no choca con la de desarrollo (5433)

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      API_PORT: 3001
      WEB_URL: ${WEB_URL:-http://localhost:47830}
      TRUST_PROXY: 1
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # Sesión de 30 días: es tu PC y tus dispositivos
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-2592000}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      APP_TIMEZONE: America/Caracas
      RATES_SYNC_ENABLED: "true"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    depends_on:
      - api

  # Un respaldo por día en la carpeta de tu PC que elegiste (idealmente sincronizada con OneDrive o Drive)
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      TZ: America/Caracas
    volumes:
      - type: bind
        source: ${BACKUP_DIR}
        target: /backups
    entrypoint: ["/bin/sh", "-c"]
    # Al encender la PC respalda si hoy no hay respaldo; luego revisa cada hora
    command:
      - |
        while true; do
          f=/backups/finanzas-$$(date +%F).sql.gz
          if [ ! -s "$$f" ]; then
            if pg_dump --no-owner | gzip > "$$f.tmp" && mv "$$f.tmp" "$$f"; then
              echo "Respaldo creado: $$f"
            else
              echo "Falló el respaldo" >&2; rm -f "$$f.tmp"
            fi
            find /backups -name 'finanzas-*.sql.gz' -mtime +$$KEEP_DAYS -delete
          fi
          sleep 3600
        done

  # Une web y API en una sola dirección. El Caddyfile va dentro de la imagen para no depender de la carpeta.
  proxy:
    build:
      context: .
      dockerfile_inline: |
        FROM caddy:2-alpine
        COPY Caddyfile /etc/caddy/Caddyfile
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "127.0.0.1:${PORT:-47830}:80"

volumes:
  pgdata:
  uploads:
