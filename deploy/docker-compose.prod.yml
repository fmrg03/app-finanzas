# Producción: base de datos + API + web detrás de Caddy (HTTPS automático con Let's Encrypt).
# Uso (desde la raíz del repo, en el servidor):
#   cp deploy/env.production.example deploy/.env    # y edítalo
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
name: finanzas

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sin "ports": la base solo es accesible desde la red interna de Docker

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      API_PORT: 3001
      WEB_URL: https://${DOMAIN}
      TRUST_PROXY: 1
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-604800}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Caracas}
      RATES_CRON: ${RATES_CRON:-0 9,13 * * *}
      RATES_SYNC_ENABLED: "true"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RECEIPTS_MODEL: ${RECEIPTS_MODEL:-claude-haiku-5-5}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # Mismo dominio que la web: Caddy envía /api/* a la API
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    depends_on:
      - api

  # Respaldo diario de la base: un archivo comprimido por día, se guardan los últimos BACKUP_KEEP_DAYS
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${APP_TIMEZONE:-America/Caracas}
    volumes:
      - backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/finanzas-$$(date +%F).sql.gz
          if pg_dump --no-owner | gzip > "$$f.tmp" && mv "$$f.tmp" "$$f"; then
            echo "Respaldo creado: $$f"
          else
            echo "Falló el respaldo" >&2; rm -f "$$f.tmp"
          fi
          find /backups -name 'finanzas-*.sql.gz' -mtime +$$KEEP_DAYS -delete
          sleep 86400
        done

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  backups:
  caddy_data:
  caddy_config:
